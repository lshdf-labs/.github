<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 306" font-family="ui-monospace,'JetBrains Mono','Cascadia Code',Menlo,Consolas,monospace" role="img" aria-label="lshdf-labs terminal">
  <style>
    .row { opacity: 0; animation: seq 7s linear infinite; }
    .r1 { animation-delay: 0s; }
    .r2 { animation-delay: .56s; }
    .r3 { animation-delay: 1.12s; }
    .r4 { animation-delay: 1.68s; }
    .r5 { animation-delay: 2.24s; }
    .r6 { animation-delay: 2.8s; }
    @keyframes seq {
      0% { opacity: 0; }
      5% { opacity: 1; }
      88% { opacity: 1; }
      93% { opacity: 0; }
      100% { opacity: 0; }
    }
    .cursor { animation: blink 1.1s steps(2, start) infinite; }
    @keyframes blink { to { visibility: hidden; } }
  </style>

  <rect x="0.5" y="0.5" width="859" height="305" rx="14" fill="#0b0b11" stroke="#232338"/>

  <circle cx="34" cy="21" r="5.5" fill="#ff5f57"/>
  <circle cx="56" cy="21" r="5.5" fill="#febc2e"/>
  <circle cx="78" cy="21" r="5.5" fill="#28c840"/>
  <line x1="0" y1="42" x2="860" y2="42" stroke="#232338"/>

  <g font-size="17">
    <text class="row r1" x="40" y="88"><tspan fill="#A78BFA">lshdf-labs:~$</tspan><tspan fill="#e6e6eb"> whoami</tspan></text>
    <text class="row r2" x="40" y="122" fill="#8f8f9d">independent security research lab</text>

    <text class="row r3" x="40" y="156"><tspan fill="#A78BFA">lshdf-labs:~$</tspan><tspan fill="#e6e6eb"> cat focus.txt</tspan></text>
    <text class="row r4" x="40" y="190" fill="#8f8f9d">vuln research / systems / fuzzing / ai security</text>

    <text class="row r5" x="40" y="224"><tspan fill="#A78BFA">lshdf-labs:~$</tspan><tspan fill="#e6e6eb"> ./disclose --coordinated</tspan></text>
    <text class="row r6" x="40" y="258"><tspan fill="#4ade80">[ok]</tspan><tspan fill="#8f8f9d"> 90-day window · vendor coordination first</tspan></text>
  </g>

  <rect class="cursor" x="40" y="272" width="10" height="18" fill="#A78BFA"/>
</svg>
